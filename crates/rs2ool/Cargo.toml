[package]
name = "rs2ool"
description = "Read, convert and browse a RuneScape 2 revision-317 cache"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["explorer"]
# The Bevy GUI behind `rs2ool cache explorer` and `rs2ool pack explorer`.
explorer = ["dep:bevy", "dep:bevy_egui", "dep:directories", "dep:rfd"]

[dependencies]
rs2cache.workspace = true
contentpack.workspace = true
rs2convert.workspace = true
rs2classic.workspace = true
anyhow.workspace = true
clap.workspace = true
crc32fast.workspace = true
image.workspace = true
indicatif.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bevy = { version = "=0.20.0", optional = true }
bevy_egui = { version = "=0.43.1", optional = true }
directories = { version = "=6.0.0", optional = true }
rfd = { version = "=0.17.2", optional = true }

[lints]
workspace = true
