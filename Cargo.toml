[package]
name = "rs2ool"
description = "Read, convert and browse an RS2 revision-317 cache"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"

[features]
default = ["explorer", "caption"]
# The Bevy GUI behind `rs2ool cache explorer` and `rs2ool pack explorer`.
explorer = ["dep:bevy", "dep:bevy_egui", "dep:directories", "dep:rfd"]
# `rs2ool cache caption`: captions sequences with a vision model on a server
# you run. Off until you turn it on in the settings. Plain HTTP only.
caption = ["dep:ureq", "dep:base64", "dep:directories"]
# https endpoints too, for a server on another machine.
caption-tls = ["caption", "ureq/rustls"]

[dependencies]
rs2cache.workspace = true
contentpack.workspace = true
rs2convert.workspace = true
rs2classic.workspace = true
anyhow.workspace = true
clap.workspace = true
crc32fast.workspace = true
image.workspace = true
indicatif.workspace = true
png = "0.18"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bevy = { version = "=0.20.0", optional = true }
bevy_egui = { version = "=0.43.1", optional = true }
directories = { version = "=6.0.0", optional = true }
rfd = { version = "=0.17.2", optional = true }
ureq = { version = "3", default-features = false, features = ["json"], optional = true }
base64 = { version = "0.23", optional = true }

[lints]
workspace = true

# The rs2ool binary is the root package, so `cargo install --path .` works
# here; the libraries live in crates/.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rs2cache = { path = "crates/rs2cache" }
contentpack = { path = "crates/contentpack" }
rs2convert = { path = "crates/rs2convert" }
rs2classic = { path = "crates/rs2classic" }
anyhow = "1"
bzip2 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
flate2 = "1"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
indicatif = "0.17"
memmap2 = "0.9"
proptest = "1"
rayon = "1"
insta = { version = "1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
zstd = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is unusably slow unoptimised; optimise dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2

# The software renderer draws whole regions per frame; keep it fast in dev.
[profile.dev.package.rs2classic]
opt-level = 3
