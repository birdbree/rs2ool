[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rs2cache = { path = "crates/rs2cache" }
rs2intermediate = { path = "crates/rs2intermediate" }
bzip2 = "0.5"
crc32fast = "1"
flate2 = "1"
memmap2 = "0.9"
proptest = "1"
insta = { version = "1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
