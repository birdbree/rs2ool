[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rs2cache = { path = "crates/rs2cache" }
contentpack = { path = "crates/contentpack" }
rs2convert = { path = "crates/rs2convert" }
rs2classic = { path = "crates/rs2classic" }
anyhow = "1"
bzip2 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
flate2 = "1"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.17"
memmap2 = "0.9"
proptest = "1"
rayon = "1"
insta = { version = "1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
zstd = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is unusably slow unoptimised; optimise dependencies in dev builds.
[profile.dev.package."*"]
opt-level = 2

# The software renderer draws whole regions per frame; keep it fast in dev.
[profile.dev.package.rs2classic]
opt-level = 3
